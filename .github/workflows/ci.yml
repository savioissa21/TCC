name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw test -q
        working-directory: dashboard-api

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s minerador-py -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-front/package-lock.json
      - run: npm ci
        working-directory: dashboard-front
      - run: npm run lint
        working-directory: dashboard-front
      - run: npm test
        working-directory: dashboard-front
      - run: npm run build
        working-directory: dashboard-front
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard-front
      - run: npm run test:e2e
        working-directory: dashboard-front

services:

  # ─────────────────────────────────────────────────
  # Banco de dados PostgreSQL
  # ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: dashboard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: dashboard_tcc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_tcc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # API Spring Boot + Python Minerador
  # ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: dashboard-api/Dockerfile
    container_name: dashboard_api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dashboard_tcc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_PROFILES_ACTIVE: prod
      MINING_PYTHON_EXECUTABLE: python3
      MINING_PYTHON_SCRIPT_PATH: /app/minerador-py/minerador_integrado.py
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_temp_data:/app/dados_temp
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  # Frontend React + Nginx
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard-front
      dockerfile: Dockerfile
    container_name: dashboard_front
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  api_temp_data:

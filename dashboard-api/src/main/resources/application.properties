spring.application.name=DashboardAPI

# --- CONEXÃO COM O BANCO DE DADOS (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dashboard_tcc}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- CONFIGURAÇÃO DO JPA (HIBERNATE) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- CONFIGURAÇÃO DE UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- SEGURANÇA JWT ---
api.security.token.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# --- CONFIGURAÇÃO DO MINERADOR PYTHON ---
# IMPORTANTE: Ajuste estes caminhos para o seu ambiente local
mining.python.executable=python
mining.python.script.path=${MINING_PYTHON_SCRIPT_PATH:../minerador-py/minerador_integrado.py}
mining.output.file=dados_temp.json
mining.process.timeout=${MINING_PROCESS_TIMEOUT:PT15M}

# --- ATUALIZAÇÃO PERIÓDICA DAS AVALIAÇÕES ---
mining.schedule.enabled=true
mining.schedule.interval=PT168H
mining.schedule.retry-interval=PT24H
mining.schedule.poll-delay-ms=3600000
mining.schedule.initial-delay-ms=60000

# --- ASYNC / TIMEOUT ---
spring.mvc.async.request-timeout=600000

# Paginação de avaliações deve ocorrer no banco, nunca sobre coleções carregadas.
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Flyway é o único responsável por criar/evoluir o esquema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true
spring.sql.init.mode=never

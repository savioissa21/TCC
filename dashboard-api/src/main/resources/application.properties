spring.application.name=DashboardAPI

# --- CONEXÃO COM O BANCO DE DADOS (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard_tcc
spring.datasource.username=postgres
spring.datasource.password=123456

# --- CONFIGURAÇÃO DO JPA (HIBERNATE) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURAÇÃO DE UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- SEGURANÇA JWT ---
api.security.token.secret=MeuTCCSuperSeguroSecretKey12345678

# --- CONFIGURAÇÃO DO MINERADOR PYTHON ---
# IMPORTANTE: Ajuste estes caminhos para o seu ambiente local
mining.python.executable=python
mining.python.script.path=C:/Users/savio/IdeaProjects/TCC/minerador-py/minerador_integrado.py
mining.output.file=dados_temp.json

# --- ASYNC / TIMEOUT ---
spring.mvc.async.request-timeout=600000

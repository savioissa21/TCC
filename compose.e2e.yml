# Ambiente inteiramente descartável. Não lê segredos, checkpoint nem volumes reais.
name: nexo-e2e
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexo_e2e
      POSTGRES_USER: nexo_test
      POSTGRES_PASSWORD: only-e2e-not-production
    volumes:
      - e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_test -d nexo_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: dashboard-api/Dockerfile
      target: e2e
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexo_e2e
      DB_USERNAME: nexo_test
      DB_PASSWORD: only-e2e-not-production
      JWT_SECRET: only-e2e-not-production-0123456789-abcdefghijklmnopqrstuvwxyz
      SPRING_PROFILES_ACTIVE: prod
      MINING_SCHEDULE_ENABLED: "false"
      MINING_PROCESS_TIMEOUT: PT30S
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:19080
      LOGGING_LEVEL_ROOT: WARN
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 40
  frontend:
    build:
      context: ./dashboard-front
    ports:
      - "127.0.0.1:19080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 15
volumes:
  e2e_postgres:
